name: Growth API checks

on:
  push:
    paths:
      - 'backend/growth-api/**'
      - '.github/workflows/growth-api.yml'
  pull_request:
    paths:
      - 'backend/growth-api/**'
      - '.github/workflows/growth-api.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/growth-api/pom.xml
      - name: Verify with PostgreSQL and MinIO
        working-directory: backend/growth-api
        run: mvn -B -ntp verify
