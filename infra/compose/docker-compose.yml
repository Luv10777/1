# ============================================================================
# 网络
# ============================================================================
networks:
  wuyao-network:
    driver: bridge

# ============================================================================
# 数据卷
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
