version: '3.8'

services:
  # ============================================================================
  # PostgreSQL 数据库
  # ============================================================================
  postgres:
    image: postgres:14-alpine
    container_name: wuyao-postgres
    environment:
      POSTGRES_DB: wuyao_nexus
      POSTGRES_USER: wuyao_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wuyao_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuyao_user -d wuyao_nexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wuyao-network
    restart: unless-stopped

  # ============================================================================
  # Redis 缓存和分布式锁
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: wuyao-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-wuyao_redis_password} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - wuyao-network
    restart: unless-stopped

  # ============================================================================
  # RabbitMQ 消息队列
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: wuyao-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-wuyao_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-wuyao_rabbitmq_password}
      RABBITMQ_DEFAULT_VHOST: wuyao
      RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS: "true"
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - wuyao-network
    restart: unless-stopped

  # ============================================================================
  # MinIO 对象存储
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: wuyao-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wuyao_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wuyao_minio_password}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - wuyao-network
    restart: unless-stopped

  # MinIO Client - 初始化桶
  minio-init:
    image: minio/mc:latest
    container_name: wuyao-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set wuyao http://minio:9000 ${MINIO_ROOT_USER:-wuyao_minio_admin} ${MINIO_ROOT_PASSWORD:-wuyao_minio_password};
      mc mb --ignore-existing wuyao/wuyao-assets;
      mc mb --ignore-existing wuyao/wuyao-temp;
      mc mb --ignore-existing wuyao/wuyao-backups;
      mc anonymous set download wuyao/wuyao-assets;
      mc ilm add wuyao/wuyao-temp --expiry-days 7;
      echo 'MinIO buckets initialized successfully';
      "
    networks:
      - wuyao-network

