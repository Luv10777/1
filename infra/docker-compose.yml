services:
  postgres:
    image: postgres:14-alpine
    container_name: wuyao-postgres
    environment:
      POSTGRES_DB: wuyao_nexus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infra/database:/docker-entrypoint-initdb.d
    networks:
      - wuyao-network

  redis:
    image: redis:7-alpine
    container_name: wuyao-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wuyao-network

volumes:
  postgres_data:
  redis_data:

networks:
  wuyao-network:
    driver: bridge
