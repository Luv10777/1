# 测试服务器部署。在仓库根目录执行：
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# 端口策略：只对外开 WEB_PORT 一个口。
# 数据库和 Redis 不映射到宿主机，只在 docker 内网可达。

name: growth

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 不对外暴露端口。要用 psql 就 docker compose exec postgres psql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      # 必须对外可达：预签名 URL 是给浏览器直传用的，
      # 浏览器访问不到 docker 内网的 minio:9000
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 10

  # 建桶，跑一次就退出
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      echo '桶已就绪: ${MINIO_BUCKET}'
      "

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_CALLBACK_URL: ${WECHAT_CALLBACK_URL:-}
      WECHAT_FRONTEND_LOGIN_PATH: ${WECHAT_FRONTEND_LOGIN_PATH:-/login}
      BILLING_OPERATOR_USER_IDS: ${BILLING_OPERATOR_USER_IDS:-}
      PLATFORM_OPERATOR_USER_IDS: ${PLATFORM_OPERATOR_USER_IDS:-}
      REAL_NAME_ENCRYPTION_KEY: ${REAL_NAME_ENCRYPTION_KEY:-}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_MERCHANT_ID: ${WECHAT_PAY_MERCHANT_ID:-}
      WECHAT_PAY_MERCHANT_SERIAL: ${WECHAT_PAY_MERCHANT_SERIAL:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PLATFORM_KEY_ID: ${WECHAT_PAY_PLATFORM_KEY_ID:-}
      WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      BILLING_PAYMENT_METHOD: ${BILLING_PAYMENT_METHOD:-WECHAT}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      ALIPAY_PRIVATE_KEY_PATH: ${ALIPAY_PRIVATE_KEY_PATH:-}
      ALIPAY_PUBLIC_KEY_PATH: ${ALIPAY_PUBLIC_KEY_PATH:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      SPRING_CONFIG_ADDITIONAL_LOCATION: ${SPRING_CONFIG_ADDITIONAL_LOCATION:-}
      APP_ARGS: >-
        --spring.datasource.url=jdbc:postgresql://postgres:5432/${DB_NAME}
        --spring.datasource.username=${DB_APP_USER}
        --spring.datasource.password=${DB_APP_PASSWORD}
        --spring.flyway.user=${DB_OWNER_USER}
        --spring.flyway.password=${DB_OWNER_PASSWORD}
        --spring.flyway.placeholders.app_db_password=${DB_APP_PASSWORD}
        --spring.data.redis.host=redis
        --spring.data.redis.password=${REDIS_PASSWORD}
        --growth.jwt.secret=${JWT_SECRET}
        --growth.storage.endpoint=${MINIO_PUBLIC_ENDPOINT}
        --growth.storage.access-key=${MINIO_USER}
        --growth.storage.secret-key=${MINIO_PASSWORD}
        --growth.storage.bucket=${MINIO_BUCKET}
        --growth.cors.allowed-origins=${CORS_ORIGINS}
        --growth.worker.enabled=false
        --management.endpoints.web.exposure.include=health,prometheus
        --growth.metrics.token=${METRICS_TOKEN:-}
    volumes:
      - ${BILLING_CONFIG_DIR:-./billing-config}:/etc/wuyao:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      # 等 api 把 Flyway 迁移跑完再起，避免两个进程抢着迁移
      api: { condition: service_healthy }
    environment:
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_CALLBACK_URL: ${WECHAT_CALLBACK_URL:-}
      WECHAT_FRONTEND_LOGIN_PATH: ${WECHAT_FRONTEND_LOGIN_PATH:-/login}
      BILLING_OPERATOR_USER_IDS: ${BILLING_OPERATOR_USER_IDS:-}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_MERCHANT_ID: ${WECHAT_PAY_MERCHANT_ID:-}
      WECHAT_PAY_MERCHANT_SERIAL: ${WECHAT_PAY_MERCHANT_SERIAL:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PLATFORM_KEY_ID: ${WECHAT_PAY_PLATFORM_KEY_ID:-}
      WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      BILLING_PAYMENT_METHOD: ${BILLING_PAYMENT_METHOD:-WECHAT}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      ALIPAY_PRIVATE_KEY_PATH: ${ALIPAY_PRIVATE_KEY_PATH:-}
      ALIPAY_PUBLIC_KEY_PATH: ${ALIPAY_PUBLIC_KEY_PATH:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      SPRING_CONFIG_ADDITIONAL_LOCATION: ${SPRING_CONFIG_ADDITIONAL_LOCATION:-}
      APP_ARGS: >-
        --spring.datasource.url=jdbc:postgresql://postgres:5432/${DB_NAME}
        --spring.datasource.username=${DB_APP_USER}
        --spring.datasource.password=${DB_APP_PASSWORD}
        --spring.flyway.enabled=false
        --spring.data.redis.host=redis
        --spring.data.redis.password=${REDIS_PASSWORD}
        --growth.jwt.secret=${JWT_SECRET}
        --growth.storage.endpoint=${MINIO_PUBLIC_ENDPOINT}
        --growth.storage.access-key=${MINIO_USER}
        --growth.storage.secret-key=${MINIO_PASSWORD}
        --growth.storage.bucket=${MINIO_BUCKET}
        --growth.worker.enabled=true
        --growth.worker.queues=DEFAULT,IMAGE,VIDEO,LIVE
        --server.port=8090
        --management.endpoints.web.exposure.include=health,prometheus
        --growth.metrics.token=${METRICS_TOKEN:-}
    volumes:
      - ${BILLING_CONFIG_DIR:-./billing-config}:/etc/wuyao:ro

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_PORT}:80"

  # 独立管理员前端。仅绑定本机；使用独立 HTTPS 域名反代或 SSH 隧道访问。
  admin:
    profiles: ["admin"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${ADMIN_HTTP_PORT:-18081}:80"

  # 监控：Prometheus 收数据，Grafana 画看板。按需开启：
  #   docker compose -f deploy/docker-compose.yml --env-file deploy/.env --profile monitoring up -d
  # Grafana 只绑定本机，用 SSH 隧道访问，步骤见 deploy/monitoring/README.md
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        [ -n "$$METRICS_TOKEN" ] || { echo "请先在 deploy/.env 里填 METRICS_TOKEN"; exit 1; } &&
        printf %s "$$METRICS_TOKEN" > /prometheus/metrics-token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/growth-overview.json
      GF_DEFAULT_LOCALE: zh-Hans
    # 不填密码就不启动，免得落回默认的 admin/admin
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        [ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "请先在 deploy/.env 里填 GRAFANA_ADMIN_PASSWORD"; exit 1; } &&
        exec /run.sh
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  pg_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
