# 测试服务器部署。在仓库根目录执行：
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# 端口策略：只对外开 WEB_PORT 一个口。
# 数据库和 Redis 不映射到宿主机，只在 docker 内网可达。

name: growth

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 不对外暴露端口。要用 psql 就 docker compose exec postgres psql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      # 必须对外可达：预签名 URL 是给浏览器直传用的，
      # 浏览器访问不到 docker 内网的 minio:9000
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 10

  # 建桶，跑一次就退出
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      echo '桶已就绪: ${MINIO_BUCKET}'
      "

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      APP_ARGS: >-
        --spring.datasource.url=jdbc:postgresql://postgres:5432/${DB_NAME}
        --spring.datasource.username=${DB_APP_USER}
        --spring.datasource.password=${DB_APP_PASSWORD}
        --spring.flyway.user=${DB_OWNER_USER}
        --spring.flyway.password=${DB_OWNER_PASSWORD}
        --spring.flyway.placeholders.app_db_password=${DB_APP_PASSWORD}
        --spring.data.redis.host=redis
        --spring.data.redis.password=${REDIS_PASSWORD}
        --growth.jwt.secret=${JWT_SECRET}
        --growth.storage.endpoint=${MINIO_PUBLIC_ENDPOINT}
        --growth.storage.access-key=${MINIO_USER}
        --growth.storage.secret-key=${MINIO_PASSWORD}
        --growth.storage.bucket=${MINIO_BUCKET}
        --growth.cors.allowed-origins=${CORS_ORIGINS}
        --growth.worker.enabled=false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      # 等 api 把 Flyway 迁移跑完再起，避免两个进程抢着迁移
      api: { condition: service_healthy }
    environment:
      APP_ARGS: >-
        --spring.datasource.url=jdbc:postgresql://postgres:5432/${DB_NAME}
        --spring.datasource.username=${DB_APP_USER}
        --spring.datasource.password=${DB_APP_PASSWORD}
        --spring.flyway.enabled=false
        --spring.data.redis.host=redis
        --spring.data.redis.password=${REDIS_PASSWORD}
        --growth.jwt.secret=${JWT_SECRET}
        --growth.storage.endpoint=${MINIO_PUBLIC_ENDPOINT}
        --growth.storage.access-key=${MINIO_USER}
        --growth.storage.secret-key=${MINIO_PASSWORD}
        --growth.storage.bucket=${MINIO_BUCKET}
        --growth.worker.enabled=true
        --growth.worker.queues=DEFAULT,IMAGE,VIDEO
        --server.port=8090

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_PORT}:80"

volumes:
  pg_data:
  redis_data:
  minio_data:
