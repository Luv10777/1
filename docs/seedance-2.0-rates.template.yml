# formula, USD/CNY settlement rate, platform markup, or evidence expiry. A
# rate remains unavailable until all of those fields are verified and filled.
# Copy the required rows into the private billing-rates.yml loaded by both the
# API and video worker. Never commit that private file or API credentials.
