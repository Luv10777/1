# 本地开发依赖。生产不用这个文件。
services:
  postgres:
    image: postgres:16-alpine
    container_name: growth-postgres
    environment:
      POSTGRES_DB: wuyao_growth
      POSTGRES_USER: growth_owner
      POSTGRES_PASSWORD: growth_dev_local
    ports: ["5432:5432"]
    volumes: ["growth_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth_owner -d wuyao_growth"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: growth-redis
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    container_name: growth-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["growth_minio:/data"]

volumes:
  growth_pg:
  growth_minio:
