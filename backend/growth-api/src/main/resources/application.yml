spring:
  application:
    name: growth-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wuyao_growth}
    username: ${DB_USER:growth_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 表结构只由 Flyway 管，代码不许改库
    properties:
      hibernate:
        jdbc.time_zone: Asia/Shanghai

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 迁移用超级用户跑，应用连接用受 RLS 约束的 growth_app
    user: ${DB_MIGRATE_USER:${DB_USER:growth_app}}
    password: ${DB_MIGRATE_PASSWORD:${DB_PASSWORD:}}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# ---- 平台自有配置 ----
growth:
  jwt:
    # 至少 32 字节。生产必须用环境变量注入。
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-ttl: 1h
    refresh-ttl: 30d
  sms:
    provider: ${SMS_PROVIDER:console}   # console | aliyun
    code-length: 6
    code-ttl: 5m
    per-phone-per-minute: 1
    per-phone-per-day: 10
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:growth-assets}
    presign-ttl: 15m
  worker:
    # api 进程设 false，worker 进程设 true。同一个 jar，两条启动命令。
    enabled: ${WORKER_ENABLED:true}
    queues: DEFAULT,IMAGE,VIDEO
    poll-interval: 2000
    batch-size: 5

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never

logging:
  level:
    com.wuyao.growth: DEBUG
