spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: growth-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wuyao_growth}
    username: ${DB_USER:growth_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:50}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION:60000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 表结构只由 Flyway 管，代码不许改库
    properties:
      hibernate:
        jdbc.time_zone: Asia/Shanghai

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 迁移用超级用户跑，应用连接用受 RLS 约束的 growth_app
    user: ${DB_MIGRATE_USER:${DB_USER:growth_app}}
    password: ${DB_MIGRATE_PASSWORD:${DB_PASSWORD:}}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  # Only ClientIpResolver applies the explicit trusted-proxy boundary.
  forward-headers-strategy: none
  shutdown: graceful

# ---- 平台自有配置 ----
growth:
  image:
    base-url: ${NEW_API_BASE_URL:}
    tenant-max-concurrent: ${IMAGE_TENANT_MAX_CONCURRENT:20}
    global-max-concurrent: ${IMAGE_GLOBAL_MAX_CONCURRENT:200}
    api-rate-limit: ${IMAGE_API_RATE_LIMIT:100}
    api-timeout: ${IMAGE_API_TIMEOUT:10}
    upload-max-pixels: ${IMAGE_UPLOAD_MAX_PIXELS:50000000}
    creation-lock-wait-seconds: ${IMAGE_CREATION_LOCK_WAIT_SECONDS:5}
    creation-lock-lease-seconds: ${IMAGE_CREATION_LOCK_LEASE_SECONDS:120}
    text:
      url: ${IMAGE_TEXT_URL:}
      api-key: ${IMAGE_TEXT_API_KEY:${NEW_API_API_KEY:}}
      model: ${IMAGE_TEXT_MODEL:deepseek-flash}
      temperature: ${IMAGE_TEXT_TEMPERATURE:0.5}
      max-tokens: ${IMAGE_TEXT_MAX_TOKENS:6000}
      timeout-seconds: ${IMAGE_TEXT_TIMEOUT_SECONDS:300}
    generator:
      protocol: ${IMAGE_GENERATOR_PROTOCOL:OPENAI}
      url: ${IMAGE_GENERATOR_URL:}
      edits-url: ${IMAGE_GENERATOR_EDITS_URL:}
      api-key: ${IMAGE_GENERATOR_API_KEY:${NEW_API_API_KEY:}}
      model: ${IMAGE_GENERATOR_MODEL:}
      # Flu waits for generation and returns the final provider URL in the
      # same response. This long timeout applies only in the image worker.
      timeout-seconds: ${IMAGE_GENERATOR_TIMEOUT_SECONDS:600}
      quality: ${IMAGE_GENERATOR_QUALITY:}
      response-format: ${IMAGE_GENERATOR_RESPONSE_FORMAT:}
      download-allowed-origins: ${IMAGE_DOWNLOAD_ALLOWED_ORIGINS:*.aliyuncs.com}
    qualities: ${IMAGE_SUPPORTED_QUALITIES:1K,2K,4K}
    max-output-pixels: ${IMAGE_MAX_OUTPUT_PIXELS:0}
    timeout-seconds: ${IMAGE_TIMEOUT_SECONDS:120}
    poll-seconds: ${IMAGE_POLL_SECONDS:5}
    max-polls: ${IMAGE_MAX_POLLS:360}
    font: ${IMAGE_FONT:Microsoft YaHei}
  video:
    provider:
      name: ${VIDEO_PROVIDER_NAME:onlyrouter}
      protocol: ${VIDEO_PROVIDER_PROTOCOL:CHAT_COMPLETIONS}
      base-url: ${VIDEO_PROVIDER_BASE_URL:https://api.onlyrouter.ai}
      api-key: ${VIDEO_PROVIDER_API_KEY:}
      submit-path: ${VIDEO_PROVIDER_SUBMIT_PATH:/v1/videos}
      poll-path: ${VIDEO_PROVIDER_POLL_PATH:/v1/videos/{jobId}}
      content-path: ${VIDEO_PROVIDER_CONTENT_PATH:/v1/videos/{jobId}/content}
      timeout-seconds: ${VIDEO_PROVIDER_TIMEOUT_SECONDS:60}
    model:
      seedance-2-5: ${VIDEO_MODEL_SEEDANCE_2_5:doubao-seedance-2-5-260628}
      seedance-2-0: ${VIDEO_MODEL_SEEDANCE_2_0:doubao-seedance-2-0-260128}
      seedance-2-0-mini: ${VIDEO_MODEL_SEEDANCE_2_0_MINI:doubao-seedance-2-0-mini-260615}
      seedance-2-0-fast: ${VIDEO_MODEL_SEEDANCE_2_0_FAST:doubao-seedance-2-0-fast-260128}
    poll-seconds: ${VIDEO_POLL_SECONDS:15}
  http:
    max-total: ${HTTP_MAX_TOTAL:200}
    max-per-route: ${HTTP_MAX_PER_ROUTE:50}
    connection-timeout: ${HTTP_CONNECTION_TIMEOUT:15}
    # Multimodal planning requests may take longer than a normal API call.
    socket-timeout: ${HTTP_SOCKET_TIMEOUT:300}
  jwt:
    # 至少 32 字节。生产必须用环境变量注入。
    secret: ${JWT_SECRET:}
    access-ttl: 1h
    refresh-ttl: 30d
  sms:
    provider: ${SMS_PROVIDER:console}   # console | aliyun
    code-length: 6
    code-ttl: 5m
    per-phone-per-minute: 1
    per-phone-per-day: 10
    per-ip-per-minute: ${SMS_PER_IP_PER_MINUTE:5}
    per-ip-per-day: ${SMS_PER_IP_PER_DAY:100}
    global-per-minute: ${SMS_GLOBAL_PER_MINUTE:100}
    global-per-day: ${SMS_GLOBAL_PER_DAY:10000}
    aliyun:
      access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
  security:
    trusted-proxies: ${TRUSTED_PROXY_CIDRS:}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:growth-assets}
    presign-ttl: 15m
    cleanup-interval-ms: ${STORAGE_CLEANUP_INTERVAL_MS:3600000}
  worker:
    # api 进程设 false，worker 进程设 true。同一个 jar，两条启动命令。
    enabled: ${WORKER_ENABLED:false}
    queues: DEFAULT,IMAGE,VIDEO_PROVIDER,MEDIA_CPU
    poll-interval: 2000
    batch-size: 5
    parallelism: ${WORKER_PARALLELISM:1}
    lease: 30m
    heartbeat-interval: 10000

management:
  endpoints.web.exposure.include: ${MANAGEMENT_EXPOSURE_INCLUDE:health}
  endpoint.health.show-details: when_authorized
  endpoint.health.roles: ACTUATOR

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.wuyao.growth: ${LOG_LEVEL:INFO}
    com.wuyao.growth.creative.image: ${LOG_LEVEL_IMAGE:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_PARAMS:WARN}
