plugins {
    id 'com.android.application'
}

// 正式签名的钥匙和密码不进代码库。默认从 ~/.yifangzhi/android-release.properties 读（storeFile、storePassword、keyAlias、keyPassword 四行），
// 也可以用 -Pyifangzhi.signing=<文件> 指到别处。没有这个文件时正式包打出来是没签名的（装不了），调试包和预览包不受影响。
// 这把钥匙丢了，已经装出去的软件就没法再更新，只能卸载重装。
def signingFile = file(project.findProperty('yifangzhi.signing') ?: "${System.getProperty('user.home')}/.yifangzhi/android-release.properties")
def signing = new Properties()
if (signingFile.isFile()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.yifangzhi.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yifangzhi.app'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.1.1'
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (signing['storeFile']) {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        // 调试包连开发用的控制台：手机上的 localhost:4173 由 adb reverse 转到电脑上的开发服务器，和桌面端开发时连的是同一个地址。
        debug {
            // 包名多一个 .dev：调试包用的是本机的调试签名，和正式包签名不同，同一个包名装不到一台手机上。
            applicationIdSuffix '.dev'
            buildConfigField 'String', 'CONSOLE_URL', '"http://localhost:4173"'
            resValue 'string', 'app_name', '一方志测试版'
        }
        // 预览包：和调试包一样用本机的调试签名、可以从电脑上检查，但连的是线上。包名不同，能和调试包并排装在一台手机上。
        // 只用来自己拿真实账号试，不能发给商家。
        preview {
            initWith debug
            applicationIdSuffix '.preview'
            buildConfigField 'String', 'CONSOLE_URL', '"https://yifangzhi.com"'
            resValue 'string', 'app_name', '一方志预览版'
            matchingFallbacks = ['debug']
        }
        release {
            buildConfigField 'String', 'CONSOLE_URL', '"https://yifangzhi.com"'
            resValue 'string', 'app_name', '一方志'
            minifyEnabled false
            signingConfig signing['storeFile'] ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}

dependencies {
    // 在网页自己的脚本之前放进一段脚本、只接收指定网站发来的消息，这两样要靠它。
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    // 手机上 org.json 是系统自带的；在电脑上跑单元测试时要另外带一份。
    testImplementation 'org.json:json:20240303'
}
