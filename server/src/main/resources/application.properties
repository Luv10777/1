# Spring Boot Configuration
spring.application.name=wuyao-nexus-server

# Server
server.port=8080
server.shutdown=graceful

# Database - PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/wuyao_nexus}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# Jackson
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.default-property-inclusion=non_null

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=2592000000

# SMS Provider
sms.provider=${SMS_PROVIDER:console}
sms.aliyun.access-key-id=${ALIYUN_SMS_ACCESS_KEY_ID:}
sms.aliyun.access-key-secret=${ALIYUN_SMS_ACCESS_KEY_SECRET:}
sms.aliyun.sign-name=${ALIYUN_SMS_SIGN_NAME:}
sms.aliyun.template-code=${ALIYUN_SMS_TEMPLATE_CODE:}

# Rate Limiting
rate-limit.sms.phone-per-minute=1
rate-limit.sms.phone-per-day=10
rate-limit.sms.ip-per-minute=5
rate-limit.sms.ip-per-day=50

# Verification Code
verification.code.length=6
verification.code.expiration=300000

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://127.0.0.1:4173}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# Logging
logging.level.root=INFO
logging.level.com.wuyao.nexus=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
